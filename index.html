<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-blomsten</title>
  <style>
    :root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#284038;background:#f5f6ee}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,850px);background:#fffdf8;border:1px solid #e5e9dc;border-radius:28px;box-shadow:0 24px 70px #425b3d16;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
    .art{background:#e8f0df;min-height:550px;display:grid;place-items:center;padding:30px}
    .panel{padding:55px 42px;display:flex;flex-direction:column;justify-content:center}
    .eyebrow{color:#52795e;font-size:12px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;margin:0 0 14px}
    h1{font-family:Georgia,serif;font-size:clamp(38px,5vw,58px);line-height:1.05;letter-spacing:-.045em;margin:0 0 18px;font-weight:500}
    p{line-height:1.55;color:#617068;margin:0 0 28px}
    svg{width:min(100%,370px);height:auto;overflow:visible;filter:drop-shadow(0 16px 15px #42633922)}
    .petal{cursor:pointer;transition:fill .18s,stroke .18s,opacity .18s;outline:none}
    .petal:hover{opacity:.78}.petal:focus-visible{stroke:#244f3a;stroke-width:5}
    .petal.selected{fill:#f48b9c;stroke:#d6687b}.petal:not(.selected){fill:#fffdf8;stroke:#adc3a8;stroke-dasharray:7 5}
    .download{border:0;border-radius:14px;background:#345e48;color:white;padding:16px 22px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;width:100%;box-shadow:0 8px 17px #345e4830}.download:hover{background:#264b38}
    .hint{font-size:13px;margin:16px 0 0;color:#7a877b}
    @media(max-width:700px){main{grid-template-columns:1fr}.art{min-height:350px;padding:18px}.art svg{width:260px}.panel{padding:32px 26px 38px}}
  </style>
</head>
<body>
  <main>
    <div class="art">
      <svg id="flower" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-label="Blomst med fem valgbare blade">
        <path d="M200 272 C202 340 196 398 201 463" fill="none" stroke="#609869" stroke-width="13" stroke-linecap="round"/>
        <path d="M199 393 C153 346 115 360 105 376 C130 421 168 424 199 393Z" fill="#85ae76" stroke="#568c62" stroke-width="3"/>
        <path d="M201 416 C236 363 275 363 296 376 C278 423 240 441 201 416Z" fill="#85ae76" stroke="#568c62" stroke-width="3"/>
        <g id="petals">
          <path class="petal" data-index="0" d="M 200 202 C 145 176 139 84 200 41 C 261 84 255 176 200 202 Z" stroke-width="3"/>
          <path class="petal" data-index="1" d="M 200 202 C 145 176 139 84 200 41 C 261 84 255 176 200 202 Z" transform="rotate(72 200 202)" stroke-width="3"/>
          <path class="petal" data-index="2" d="M 200 202 C 145 176 139 84 200 41 C 261 84 255 176 200 202 Z" transform="rotate(144 200 202)" stroke-width="3"/>
          <path class="petal" data-index="3" d="M 200 202 C 145 176 139 84 200 41 C 261 84 255 176 200 202 Z" transform="rotate(216 200 202)" stroke-width="3"/>
          <path class="petal" data-index="4" d="M 200 202 C 145 176 139 84 200 41 C 261 84 255 176 200 202 Z" transform="rotate(288 200 202)" stroke-width="3"/>
        </g>
        <circle cx="200" cy="202" r="46" fill="#f4c665" stroke="#d6a84e" stroke-width="3" pointer-events="none"/>
        <circle cx="186" cy="190" r="3" fill="#d09a41" pointer-events="none"/><circle cx="213" cy="185" r="3" fill="#d09a41" pointer-events="none"/><circle cx="200" cy="207" r="3" fill="#d09a41" pointer-events="none"/><circle cx="181" cy="215" r="3" fill="#d09a41" pointer-events="none"/><circle cx="218" cy="216" r="3" fill="#d09a41" pointer-events="none"/>
        <g aria-hidden="true" fill="#365342" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" pointer-events="none">
          <text x="200" y="102">AI-funktion 1</text>
          <text x="295" y="171">AI-funktion 2</text>
          <text x="259" y="283">AI-funktion 3</text>
          <text x="141" y="283">AI-funktion 4</text>
          <text x="105" y="171">AI-funktion 5</text>
        </g>
      </svg>
    </div>
    <section class="panel">
      <div class="eyebrow">Nannas</div>
      <h1>AI-blomsten</h1>
      <p>Tryk på de AI-funktioner, du vil markere på blomsten.</p>
      <button class="download" id="download" type="button">Download som PNG ↓</button>
      <div class="hint">PNG-filen har gennemsigtig baggrund.</div>
    </section>
  </main>
  <script>
    const svg = document.getElementById('flower');
    const petals = [...svg.querySelectorAll('.petal')];
    const selected = new Set();
    petals.forEach((petal,i)=>{
      petal.setAttribute('role','button');petal.setAttribute('tabindex','0');
      const toggle=()=>{selected.has(i)?selected.delete(i):selected.add(i);render()};
      petal.addEventListener('click',toggle);
      petal.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
    });
    function render(){
      petals.forEach((petal,i)=>{
        petal.classList.toggle('selected',selected.has(i));
        petal.setAttribute('aria-label',`AI-funktion ${i+1}, ${selected.has(i)?'markeret':'ikke markeret'}`);
        petal.setAttribute('aria-pressed',String(selected.has(i)));
      });
    }
    render();
    document.getElementById('download').addEventListener('click',async()=>{
      const copy=svg.cloneNode(true);
      copy.removeAttribute('id');copy.removeAttribute('role');copy.removeAttribute('aria-label');
      copy.querySelectorAll('.petal').forEach((petal,i)=>{
        petal.setAttribute('fill',selected.has(i)?'#f48b9c':'#fffdf8');
        petal.setAttribute('stroke',selected.has(i)?'#d6687b':'#adc3a8');
        if(!selected.has(i))petal.setAttribute('stroke-dasharray','7 5');
        petal.removeAttribute('class');petal.removeAttribute('role');petal.removeAttribute('tabindex');
        petal.removeAttribute('aria-label');petal.removeAttribute('aria-pressed');
      });
      const source=new XMLSerializer().serializeToString(copy);
      const url=URL.createObjectURL(new Blob([source],{type:'image/svg+xml;charset=utf-8'}));
      try{
        const img=new Image();
        await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
        const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=1440;
        const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
        const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
        if(!blob)throw new Error('PNG kunne ikke oprettes');
        const pngUrl=URL.createObjectURL(blob);
        const link=document.createElement('a');link.href=pngUrl;link.download=`min-blomst-${selected.size}-blade.png`;
        document.body.append(link);link.click();link.remove();
        setTimeout(()=>URL.revokeObjectURL(pngUrl),1000);
      }catch(error){alert('Kunne ikke gemme PNG-filen. Prøv igen.');console.error(error)}
      finally{URL.revokeObjectURL(url)}
    });
  </script>
</body>
</html>
